# Magileads AI Server — déploiement Docker / Dokploy.
#
# Dokploy : soit "Application" (build du Dockerfile) et tu saisis les variables
# dans l'UI, soit "Compose" avec ce fichier. Les valeurs viennent d'un .env à
# côté de ce fichier (ou des variables définies dans Dokploy).

services:
  ai-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: magileads-ai-server:latest
    container_name: magileads-ai-server
    restart: unless-stopped
    ports:
      # Derrière le reverse-proxy Dokploy (Traefik), ce mapping peut être retiré :
      # le service est alors exposé via un domaine sur le port 8787.
      - "${PORT:-8787}:8787"
    environment:
      PORT: 8787
      # Origines autorisées (CORS) : indiquer l'URL EXACTE du front.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-20}
      MAGILEADS_API_BASE: ${MAGILEADS_API_BASE:-https://app.api-magileads.net}
      # OpenRouter reste le fournisseur partagé par défaut.
      AI_API_URL: ${AI_API_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MODEL_COMPLEX: ${AI_MODEL_COMPLEX:-}
      # Clés OpenAI/Claude par compte, chiffrées avec cette clé maître.
      AI_CREDENTIALS_KEY: ${AI_CREDENTIALS_KEY:-}
      AI_CREDENTIALS_FILE: /data/provider-keys.json
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_MODEL_COMPLEX: ${OPENAI_MODEL_COMPLEX:-gpt-5.4}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_COMPLEX: ${ANTHROPIC_MODEL_COMPLEX:-claude-sonnet-5}
    volumes:
      - ai-credentials:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ai-credentials:
